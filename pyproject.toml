[project]
name = "wayfind-mcp-client"
version = "0.1.0"
description = "Wayfind agent backend — LangGraph + MCP Client + FastMCP Server"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # LangGraph + LangChain
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",

    # MCP
    "fastmcp>=2.0.0",

    # Pydantic + settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",

    # Async HTTP (service clients)
    "httpx>=0.27.0",

    # Environment
    "python-dotenv>=1.0.0",

    # Session backend
    "redis>=5.1.0",

    # YAML config loading
    "pyyaml>=6.0.2",

    # Security / media
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "agent", "mcp_client", "mcp_server", "schemas", "services"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "agent", "mcp_client", "mcp_server", "schemas", "services"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
