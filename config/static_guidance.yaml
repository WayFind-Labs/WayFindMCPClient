found_child:
  guidance: |
    If you have found an unaccompanied child on the street:
    • DO NOT post photos of the child on WhatsApp, Facebook, or public social media. This puts the child's safety at risk.
    • Stay with the child in a well-lit, public location (such as near a station security post or crowded shop). Do not take the child into private unmonitored spaces.
    • Contact the Child Helpline (1098) or local police immediately.
    • We will record the child's intake details safely and issue an official case reference for authorized child protection staff.
  next_steps:
    - Dial Child Helpline 1098 or local police
    - Remain in a public, safe, and visible location
    - Provide intake details to receive a Wayfind Case Reference

missing_child:
  no_match_message: |
    We searched our current records and did not find a child matching the
    information provided. This does not mean the child is absent from all
    records — our database covers only registered cases from partner shelters.
  next_steps:
    - File a police report if not already done
    - Contact local child-welfare organizations
    - Submit a report through Wayfind for ongoing monitoring

shelter:
  guidance: |
    Use authorized child-intake shelters and government child welfare bureaus only.
    Avoid taking unaccompanied children to unverified private facilities.
    Always request official documentation and an intake receipt.
  next_steps:
    - Locate authorized shelter via Wayfind directory
    - Request official child intake receipt
    - Inform local child protection bureau

safety:
  guidance: |
    Never leave an unaccompanied child alone.
    Always remain in well-lit, public spaces when waiting for authorities.
    If medical attention is required, proceed to the nearest government emergency hospital.
  next_steps:
    - Stay in a safe, visible public space
    - Call local emergency services
    - Contact medical emergency if child requires treatment
